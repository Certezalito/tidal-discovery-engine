[project]
name = "tidal-discovery-engine"
version = "0.1.0"
description = "Curate and discover music playlists with Tidal, Last.fm, and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click",
    "tidalapi",
    "pylast",
    "python-dotenv",
    # google-genai>=2.25.0 required for Gemini Interactions API (client.interactions.create),
    # steps schema (Api-Revision: 2026-05-20), output_text helper, service_tier, and thinking_level (Principle X)
    "google-genai>=2.25.0",
]

[project.scripts]
# Primary ergonomic shortcut command (Principle IX: CLI Ergonomics & Friction Reduction)
tde = "src.cli.main:cli"
# Full descriptive alias matching the project repository name
tidal-discovery-engine = "src.cli.main:cli"

[build-system]
# Setuptools backend configured for PEP 621 metadata and console script generation
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Include the src directory and its subpackages while preserving `from src...` imports
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
